name: "Notify and Tag"
description: "Crea un git tag, genera release notes y simula una notificación"
author: "Victor Cassana"

inputs:
  version:
    description: "Versión semántica (ej: 1.0.0)"
    required: true
  environment:
    description: "Entorno destino (staging, production)"
    required: false
    default: "staging"
  webhook_url:
    description: "URL del webhook para notificación"
    required: false
    default: ""
  create_tag:
    description: "Si debe crear el git tag (true/false)"
    required: false
    default: "true"

outputs:
  tag_name:
    description: "El tag git creado"
    value: ${{ steps.create_tag.outputs.tag }}
  release_notes:
    description: "Ruta al archivo de release notes generado"
    value: ${{ steps.gen_notes.outputs.notes_path }}

runs:
  using: "composite"
  steps:
    - name: Validar inputs
      shell: bash
      run: |
        echo "Validando inputs..."
        if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Advertencia: El formato de versión ${{ inputs.version }} puede no ser semántico estándar (X.Y.Z)."
        fi
        echo "Versión: ${{ inputs.version }}"
        echo "Entorno: ${{ inputs.environment }}"

    - name: Crear git tag
      id: create_tag
      shell: bash
      run: |
        TAG="v${{ inputs.version }}"
        if [ "${{ inputs.create_tag }}" = "true" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG en ${{ inputs.environment }}" || echo "Tag $TAG ya existe localmente"
          echo "Tag $TAG listo para publicar"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Generar release notes
      id: gen_notes
      shell: bash
      run: |
        NOTES_FILE="RELEASE_NOTES_v${{ inputs.version }}.md"
        echo "# Release Notes - v${{ inputs.version }}" > $NOTES_FILE
        echo "" >> $NOTES_FILE
        echo "**Fecha:** $(date -u)" >> $NOTES_FILE
        echo "**Entorno:** ${{ inputs.environment }}" >> $NOTES_FILE
        echo "" >> $NOTES_FILE
        echo "### Cambios incluidos:" >> $NOTES_FILE
        git log -n 5 --oneline >> $NOTES_FILE || echo "- Initial commit" >> $NOTES_FILE
        
        cat $NOTES_FILE
        echo "notes_path=$NOTES_FILE" >> $GITHUB_OUTPUT

    - name: Enviar notificación (simulada)
      shell: bash
      run: |
        echo "Enviando notificación al entorno: ${{ inputs.environment }}"
        if [ -n "${{ inputs.webhook_url }}" ]; then
          echo "Webhook configurado. Enviando payload simulado..."
          echo "Payload: {\"version\": \"v${{ inputs.version }}\", \"env\": \"${{ inputs.environment }}\"}"
        else
          echo "No se configuró webhook_url. Notificación en log completada."
        fi
        echo "Notificación completada exitosamente."